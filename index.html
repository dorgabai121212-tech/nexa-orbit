<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXA">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>NEXA</title>
<style>
:root{
  --ink:#eaf0ff; --dim:#94a5c9; --faint:#5b6a8c;
  --ok:#39e6a4; --warn:#ffc857; --bad:#ff5d6c; --gold:#ffd479; --blue:#6fb4ff;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:#04060f;position:fixed;inset:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Rubik,"Noto Sans Hebrew",Arial,sans-serif;
  color:var(--ink);overscroll-behavior:none;touch-action:none;-webkit-font-smoothing:antialiased}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none}

#hud{position:fixed;inset:0;z-index:2;pointer-events:none}

#head{position:absolute;top:calc(var(--st) + 10px);inset-inline:12px;
  padding:13px 16px 14px;border-radius:20px;
  background:linear-gradient(180deg,rgba(10,16,32,.90),rgba(8,12,26,.70));
  border:1px solid rgba(120,150,220,.20);
  backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
  box-shadow:0 18px 50px -22px rgba(0,0,0,.95);transition:opacity .35s,transform .35s}
#head.hide{opacity:0;transform:translateY(-16px);pointer-events:none}
#hrow{display:flex;align-items:center;gap:11px}
#hdot{width:13px;height:13px;border-radius:50%;flex:none}
#htitle{font-size:20px;font-weight:800;letter-spacing:-.3px;line-height:1.15}
#hsub{margin-top:6px;font-size:13.5px;line-height:1.45;color:var(--dim)}
#hmeta{margin-top:9px;display:flex;gap:7px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);color:var(--dim);white-space:nowrap}
.chip b{color:var(--ink);font-weight:800}
.chip.q{color:#ffd479;border-color:rgba(255,212,121,.32);background:rgba(255,212,121,.09)}
.chip.g{color:#8bf3cd;border-color:rgba(57,230,164,.32);background:rgba(57,230,164,.09)}

#labels{position:absolute;inset:0}
.lab{position:absolute;transform:translate(-50%,-50%);padding:6px 10px 7px;border-radius:13px;
  white-space:nowrap;background:rgba(6,11,24,.82);border:1px solid rgba(255,255,255,.10);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 10px 26px -14px #000;pointer-events:auto;cursor:pointer;transition:opacity .22s}
.lab .n{font-size:13px;font-weight:800;line-height:1.1;display:flex;align-items:center;gap:6px}
.lab .n i{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.lab .v{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.15;font-weight:600}
.lab.off{opacity:0;pointer-events:none}
.lab .n{font-size:12.5px}
.lab{padding:5px 9px 6px}
.lab .v{font-size:11px;margin-top:2px}
.bub{position:absolute;transform:translate(-50%,-50%);width:max-content;max-width:min(258px,70vw);
  padding:7px 11px 8px;border-radius:14px;font-size:12.5px;font-weight:700;line-height:1.35;
  background:rgba(6,20,16,.86);border:1px solid rgba(57,230,164,.42);color:#bdf6df;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 10px 30px -16px #000, 0 0 22px -8px rgba(57,230,164,.5);
  pointer-events:none;opacity:0;transition:opacity .5s;text-align:center}
.bub:after{content:"";position:absolute;bottom:-6px;left:50%;transform:translateX(-50%) rotate(45deg);
  width:10px;height:10px;background:rgba(6,20,16,.86);
  border-right:1px solid rgba(57,230,164,.42);border-bottom:1px solid rgba(57,230,164,.42)}

#nav{position:fixed;z-index:6;bottom:calc(var(--sb) + 12px);inset-inline:0;display:flex;justify-content:center;gap:8px;pointer-events:none}
#nav .tab{pointer-events:auto;border:1px solid rgba(255,255,255,.10);font-family:inherit;cursor:pointer;
  font-size:13.5px;font-weight:800;color:var(--dim);padding:11px 17px;border-radius:999px;
  background:rgba(8,13,26,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  transition:color .2s,background .2s,border-color .2s,transform .2s}
#nav .tab.on{color:#07101f;background:linear-gradient(180deg,#ffe6ae,#ffcf74);border-color:transparent;transform:translateY(-2px)}
#nav .tab:active{transform:scale(.95)}
#nav .tab{padding:11px 14px}

/* ---------- the brain view ----------
   The same head as the board on the PC, points only: a phone gets the shape and
   the tally, not a lit surface. Nothing here carries words of its own — every
   name below arrives with the rest of the encrypted state. */
#brain{position:absolute;inset-inline:0;bottom:calc(var(--sb) + 68px);z-index:5;
  padding:0 14px;opacity:0;pointer-events:none;transition:opacity .4s;
  max-height:52vh;overflow:auto;-webkit-overflow-scrolling:touch}
#brain.on{opacity:1;pointer-events:auto}
#brain .box{background:rgba(8,13,26,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:13px 15px 14px}
#brain .ttl{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--dim)}
#brain .ttl b{font-size:16px;color:var(--ink);font-weight:800}
#brain .ttl .pc{margin-inline-start:auto;font-size:19px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
#brain .sum{font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.5}
#brain .rows{margin-top:10px;display:flex;flex-direction:column;gap:7px}
#brain .r .top{display:flex;align-items:center;gap:7px}
#brain .r .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 8px currentColor}
#brain .r .nm{font-size:13px;font-weight:700;flex:1}
#brain .r .ct{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
#brain .r .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.09);margin-top:4px;display:flex;overflow:hidden}
#brain .r .bar i{display:block;height:100%;border-radius:2px}
#brain .none{font-size:13px;color:var(--dim);line-height:1.6}
#brain .none b{color:var(--ink)}
/* out of the way, so the head can actually be looked at */
#brain.away{opacity:0;pointer-events:none;transform:translateY(24px)}
#brain{transition:opacity .32s,transform .32s}
#nav{transition:opacity .32s,transform .32s}
#nav.away{opacity:0;pointer-events:none;transform:translateY(24px)}
#bhint{position:fixed;bottom:calc(var(--sb) + 16px);inset-inline:0;z-index:6;text-align:center;
  font-size:12px;color:var(--faint);opacity:0;pointer-events:none;transition:opacity .5s}
#bhint.on{opacity:1}
/* the two runners — the only things here that can be dead right now */
#brain .run{display:flex;flex-direction:column;gap:6px;margin-bottom:11px;
  padding-bottom:11px;border-bottom:1px solid rgba(255,255,255,.09)}
#brain .rn{display:flex;align-items:center;gap:8px;font-size:12.5px}
#brain .rn i{width:9px;height:9px;border-radius:50%;flex:none;background:currentColor;
  box-shadow:0 0 10px currentColor}
#brain .rn.ok i{color:var(--ok)} #brain .rn.warn i{color:var(--warn)}
#brain .rn.bad i{color:var(--bad)} #brain .rn.off i{color:#4a5876;box-shadow:none}
#brain .rn .k{font-weight:800;color:var(--ink);flex:none}
#brain .rn .v{color:var(--dim);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#brain .rn .w{font-size:10px;color:var(--faint);flex:none;padding:2px 6px;border-radius:999px;
  border:1px solid rgba(255,255,255,.10)}
/* A phone on its side has no room below anything. The panel becomes a column
   down one edge and the head is pushed to the other, instead of the two of them
   fighting over the same three hundred pixels. */
@media (max-height:560px){
  #brain{top:10px;bottom:calc(var(--sb) + 62px);left:10px;right:auto;width:46%;max-height:none;padding:0}
  #brain .rows{gap:5px}
  #brain .r .nm{font-size:12px}
}

#scrim{position:absolute;inset:0;opacity:0;transition:opacity .4s;pointer-events:none;background:radial-gradient(circle at 50% 47%,rgba(4,6,15,.52),rgba(4,6,15,.90) 72%)}
#scrim.on{opacity:1}
#big{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .4s}
#big.on{opacity:1}
#bignum{font-size:26vw;font-weight:900;letter-spacing:-.055em;line-height:.88;
  background:linear-gradient(180deg,#fff,#ffd88b 60%,#ff9f43);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 40px rgba(255,180,60,.5))}
#bigof{font-size:14px;font-weight:800;color:var(--dim);letter-spacing:.10em;margin-top:2px}
#bigst{margin-top:18px;padding:9px 15px;border-radius:999px;font-size:13px;font-weight:800;border:1px solid}
#biglines{margin-top:20px;display:flex;flex-direction:column;gap:8px;width:min(340px,86vw)}
.bl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;
  background:rgba(7,11,24,.90);border:1px solid rgba(255,255,255,.10);font-size:13px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.bl span{color:var(--dim);font-weight:600}
.bl b{font-weight:800;font-variant-numeric:tabular-nums}

#sheet{position:fixed;inset-inline:0;bottom:0;z-index:3;max-height:76vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(11,17,34,.975),rgba(6,10,22,.995));
  border-top:1px solid rgba(255,255,255,.12);border-radius:26px 26px 0 0;
  box-shadow:0 -26px 70px -28px #000;transform:translateY(101%);
  transition:transform .42s cubic-bezier(.22,1,.28,1);pointer-events:auto;
  padding-bottom:calc(var(--sb) + 76px)}
#sheet.open{transform:translateY(0)}
#grab{padding:12px 0 6px;display:flex;justify-content:center;flex:none;touch-action:none}
#grab i{width:42px;height:5px;border-radius:99px;background:rgba(255,255,255,.26);display:block}
#shead{padding:2px 20px 12px;display:flex;align-items:center;gap:10px;flex:none}
#shead i.d{width:11px;height:11px;border-radius:50%;flex:none}
#shead h2{font-size:19px;font-weight:800;letter-spacing:-.2px}
#shead .x{margin-inline-start:auto;font-size:12px;font-weight:800;color:var(--faint);
  border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 11px;background:none;font-family:inherit;cursor:pointer}
#sbody{padding:0 20px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;
  border-bottom:1px solid rgba(255,255,255,.06);font-size:14px;align-items:flex-start}
.kv:last-child{border-bottom:0}
.kv span{color:var(--dim);flex:none;font-weight:600}
.kv b{font-weight:800;text-align:start;word-break:break-word}
.note{margin-top:14px;padding:13px 15px;border-radius:14px;font-size:13.5px;line-height:1.6;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);color:#c3cfe8}
.sec{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--faint);
  margin:14px 0 8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.07)}
.sec:first-child{margin-top:0}
.nx{padding:11px 13px;border-radius:14px;margin-bottom:8px;
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08)}
.nx.cur{background:rgba(111,180,255,.10);border-color:rgba(111,180,255,.38)}
.nh{font-size:14px;font-weight:800}
.nx.cur .nh{color:#9ecbff}
.np{font-size:12.5px;color:var(--dim);margin-top:4px;line-height:1.55}
.tl{position:relative;padding-inline-start:22px;margin-top:4px}
.tl:before{content:"";position:absolute;inset-block:8px;inset-inline-start:5px;width:2px;
  background:linear-gradient(180deg,rgba(255,212,121,.55),rgba(111,180,255,.30),transparent)}
.ev{position:relative;padding:0 0 20px}
.ev:before{content:"";position:absolute;inset-inline-start:-21px;top:5px;width:12px;height:12px;
  border-radius:50%;background:#0a1020;border:2.5px solid var(--blue)}
.ev.g:before{border-color:var(--ok)}.ev.y:before{border-color:var(--gold)}.ev.r:before{border-color:var(--bad)}
.ev .t{font-size:11.5px;font-weight:800;color:var(--faint);letter-spacing:.05em}
.ev .h{font-size:14.5px;font-weight:800;margin-top:3px;line-height:1.3}
.ev .p{font-size:13px;color:var(--dim);margin-top:4px;line-height:1.55}

#stale{position:fixed;top:calc(var(--st) + 10px);inset-inline:12px;z-index:5;padding:10px 14px;border-radius:14px;
  font-size:12.5px;font-weight:700;background:rgba(255,93,108,.16);border:1px solid rgba(255,93,108,.42);
  color:#ffb3ba;display:none;text-align:center;pointer-events:auto;cursor:pointer}
#stale.on{display:block}

#lock{position:fixed;inset:0;z-index:8;background:#04060f;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:24px}
#lock.on{display:flex}
#lock h1{font-size:22px;font-weight:900;letter-spacing:-.3px}
#lock p{font-size:13.5px;color:var(--dim);text-align:center;max-width:300px;line-height:1.6}
#pin{font-size:26px;font-weight:800;letter-spacing:.28em;text-align:center;width:min(280px,78vw);
  padding:14px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  color:var(--ink);font-family:inherit;outline:none}
#pinb{font-family:inherit;font-size:15px;font-weight:800;padding:13px 30px;border-radius:999px;border:0;
  background:linear-gradient(180deg,#ffe6ae,#ffcf74);color:#07101f;cursor:pointer}
#pinerr{font-size:13px;font-weight:700;color:#ff8b96;min-height:18px}

#boot{position:fixed;inset:0;z-index:9;background:#04060f;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;transition:opacity .6s;font-size:12px;color:var(--faint);letter-spacing:.32em;font-weight:800}
#boot.gone{opacity:0;pointer-events:none}
#bootring{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,212,121,.16);border-top-color:#ffcf74;
  animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#fail{position:fixed;inset:0;z-index:10;background:#04060f;display:none;align-items:center;justify-content:center;
  padding:30px;font-size:14px;line-height:1.7;color:#ffb3ba;text-align:center}
@media (min-width:820px){
  #head{inset-inline:auto;inset-inline-start:50%;transform:translateX(-50%);width:520px}
  #head.hide{transform:translateX(-50%) translateY(-16px)}
  #sheet{inset-inline:auto;inset-inline-start:50%;transform:translateX(-50%) translateY(101%);width:520px}
  #sheet.open{transform:translateX(-50%) translateY(0)}
  #stale{inset-inline:auto;inset-inline-start:50%;transform:translateX(-50%);width:520px}
}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="hud">
  <div id="head">
    <div id="hrow"><i id="hdot"></i><div id="htitle">—</div></div>
    <div id="hsub">—</div><div id="hmeta"></div>
  </div>
  <div id="labels"></div>
  <div id="scrim"></div>
  <div id="big">
    <div id="bignum">—</div><div id="bigof">מתוך 100</div>
    <div id="bigst"></div><div id="biglines"></div>
  </div>
</div>
<div id="nav">
  <button class="tab" data-v="now">עכשיו</button>
  <button class="tab" data-v="count">המונה</button>
  <button class="tab" data-v="log">המסלול</button>
  <button class="tab on" data-v="brain">המוח</button>
</div>

<div id="brain"><div class="box"></div></div>
<div id="bhint">גרירה מסובבת · צביטה מקרבת · נגיעה מחזירה את הפרטים</div>
<div id="stale"></div>
<div id="sheet">
  <div id="grab"><i></i></div>
  <div id="shead"><i class="d"></i><h2>—</h2><button class="x">סגור</button></div>
  <div id="sbody"></div>
</div>
<div id="lock">
  <h1>NEXA</h1>
  <p>הקוד נשמר במכשיר הזה. תקליד אותו פעם אחת ולא תצטרך שוב.</p>
  <input id="pin" inputmode="numeric" autocomplete="off" placeholder="••••••••">
  <button id="pinb">פתח</button>
  <div id="pinerr"></div>
</div>
<div id="boot"><div id="bootring"></div><div>NEXA</div></div>
<div id="fail"></div>
<script>
/* ============================================================
   NEXA mini-3D — a small hand-written WebGL engine.
   No library, no CDN, works with the phone in flight mode.
   ============================================================ */
const NX = (function(){

/* ---------- matrices (column-major, WebGL order) ---------- */
function m4(){ return new Float32Array(16); }
function ident(o){ o=o||m4(); o.fill(0); o[0]=o[5]=o[10]=o[15]=1; return o; }
function mul(a,b,o){ // o = a * b
  o=o||m4();
  for(let c=0;c<4;c++){
    const b0=b[c*4],b1=b[c*4+1],b2=b[c*4+2],b3=b[c*4+3];
    o[c*4  ]=a[0]*b0+a[4]*b1+a[8]*b2+a[12]*b3;
    o[c*4+1]=a[1]*b0+a[5]*b1+a[9]*b2+a[13]*b3;
    o[c*4+2]=a[2]*b0+a[6]*b1+a[10]*b2+a[14]*b3;
    o[c*4+3]=a[3]*b0+a[7]*b1+a[11]*b2+a[15]*b3;
  }
  return o;
}
function perspective(fovy,aspect,near,far,o){
  o=ident(o); const f=1/Math.tan(fovy/2);
  o[0]=f/aspect; o[5]=f; o[10]=(far+near)/(near-far); o[11]=-1;
  o[14]=(2*far*near)/(near-far); o[15]=0; return o;
}
function lookAt(eye,center,up,o){
  o=o||m4();
  let zx=eye[0]-center[0], zy=eye[1]-center[1], zz=eye[2]-center[2];
  let l=Math.hypot(zx,zy,zz)||1; zx/=l; zy/=l; zz/=l;
  let xx=up[1]*zz-up[2]*zy, xy=up[2]*zx-up[0]*zz, xz=up[0]*zy-up[1]*zx;
  l=Math.hypot(xx,xy,xz)||1; xx/=l; xy/=l; xz/=l;
  const yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
  o[0]=xx; o[1]=yx; o[2]=zx; o[3]=0;
  o[4]=xy; o[5]=yy; o[6]=zy; o[7]=0;
  o[8]=xz; o[9]=yz; o[10]=zz; o[11]=0;
  o[12]=-(xx*eye[0]+xy*eye[1]+xz*eye[2]);
  o[13]=-(yx*eye[0]+yy*eye[1]+yz*eye[2]);
  o[14]=-(zx*eye[0]+zy*eye[1]+zz*eye[2]);
  o[15]=1; return o;
}
/* model matrix: uniform scale, rotation about Y, then translation */
function model(px,py,pz,ry,s,rx,o){
  o=ident(o);
  const cy=Math.cos(ry), sy=Math.sin(ry);
  const cx=Math.cos(rx||0), sx=Math.sin(rx||0);
  // Rx * Ry, then scale
  const r00=cy,      r01=0,   r02=sy;
  const r10=sx*sy,   r11=cx,  r12=-sx*cy;
  const r20=-cx*sy,  r21=sx,  r22=cx*cy;
  o[0]=r00*s; o[1]=r10*s; o[2]=r20*s;
  o[4]=r01*s; o[5]=r11*s; o[6]=r21*s;
  o[8]=r02*s; o[9]=r12*s; o[10]=r22*s;
  o[12]=px; o[13]=py; o[14]=pz;
  return o;
}
function xform(m,v,o){ // full 4x4 transform of a point, returns [x,y,z,w]
  o=o||[0,0,0,0];
  o[0]=m[0]*v[0]+m[4]*v[1]+m[8]*v[2]+m[12];
  o[1]=m[1]*v[0]+m[5]*v[1]+m[9]*v[2]+m[13];
  o[2]=m[2]*v[0]+m[6]*v[1]+m[10]*v[2]+m[14];
  o[3]=m[3]*v[0]+m[7]*v[1]+m[11]*v[2]+m[15];
  return o;
}

/* ---------- geometry ---------- */
function sphere(rings,segs){
  const pos=[],nrm=[],idx=[];
  for(let y=0;y<=rings;y++){

    " float streak=pow(max(0.0,n1*0.62+n2*0.38), 2.6);"+
    /* the streamers reach further where the noise is strong, and fade out */
    " float reach=0.34+0.62*streak;"+
    " float radial=smoothstep(reach,0.24,r)*smoothstep(0.20,0.30,r);"+
    " float v=streak*radial*uO;"+
    " gl_FragColor=vec4(uC*v, v); }");

  BUF.quad = NX.buf(gl, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]));
  GEO.sph = NX.sphere(32,48);
  BUF.sphP = NX.buf(gl, GEO.sph.pos);
  BUF.sphN = NX.buf(gl, GEO.sph.nrm);
  BUF.sphI = NX.buf(gl, GEO.sph.idx, gl.ELEMENT_ARRAY_BUFFER);
  GEO.sphCount = GEO.sph.idx.length;
  GEO.ship = buildShip();
  GEO.worker = buildWorker();

  var rg = NX.torusArc(1.0, 0.055, Math.PI*2, 96, 6);
  BUF.ringP = NX.buf(gl, rg.pos);
  BUF.ringI = NX.buf(gl, rg.idx, gl.ELEMENT_ARRAY_BUFFER);
  GEO.ringN = rg.idx.length;

  BUF.dyn = gl.createBuffer();

  buildMilkyWay();

}

function makeTarget(w,h,type){
  var tex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,type,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  var fb=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  var ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return ok ? {tex:tex,fb:fb,w:w,h:h} : null;
}
function buildPost(){
  var VS = "attribute vec2 aQ; varying vec2 vT;"+
           "void main(){ vT=aQ*0.5+0.5; gl_Position=vec4(aQ,0.0,1.0); }";
  PROG.bright = NX.program(gl, VS,
    "precision mediump float; varying vec2 vT; uniform sampler2D uS; uniform float uThr;"+
    "void main(){ vec3 c=texture2D(uS,vT).rgb;"+
    " float l=dot(c,vec3(0.2126,0.7152,0.0722));"+
    " float k=max(0.0,l-uThr); k=k*k/(k+0.35);"+
    " gl_FragColor=vec4(c*(l>0.0001? k/l : 0.0),1.0); }");
  PROG.blur = NX.program(gl, VS,
    "precision mediump float; varying vec2 vT; uniform sampler2D uS; uniform vec2 uDir;"+
    "void main(){ vec3 c=texture2D(uS,vT).rgb*0.227027;"+
    " c+=texture2D(uS,vT+uDir*1.3846).rgb*0.316216;"+
    " c+=texture2D(uS,vT-uDir*1.3846).rgb*0.316216;"+
    " c+=texture2D(uS,vT+uDir*3.2308).rgb*0.070270;"+
    " c+=texture2D(uS,vT-uDir*3.2308).rgb*0.070270;"+
    " gl_FragColor=vec4(c,1.0); }");
  PROG.post = NX.program(gl, VS,
    "precision mediump float; varying vec2 vT;"+
    "uniform sampler2D uScene,uBloom,uStreak; uniform float uAmt,uT,uStr; uniform vec2 uRes;"+
    /* a lens does not sample the three channels at the same place */
    "vec3 chroma(sampler2D s, vec2 uv){"+
    " vec2 d=(uv-0.5); float k=dot(d,d)*0.0035;"+
    " return vec3(texture2D(s,uv+d*k).r, texture2D(s,uv).g, texture2D(s,uv-d*k).b); }"+
    /* ACES filmic curve: highlights roll off instead of clipping to white */
    "vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0); }"+
    "void main(){"+
    " vec3 c=chroma(uScene,vT);"+
    " c+=texture2D(uBloom,vT).rgb*uAmt;"+
    /* The anamorphic streak. A wide lens smears a bright point sideways into a
       cold horizontal flare, and that one artefact is most of why a frame reads
       as a film and not as a chart. It is tinted cool and kept well under the
       round bloom, because a streak you notice as a streak is a filter. */
    " c+=texture2D(uStreak,vT).rgb*vec3(0.55,0.74,1.0)*uStr;"+
    " c=aces(c*1.06);"+
    " float r=length((vT-0.5)*vec2(1.0,1.12));"+
    " c*=1.0-0.50*smoothstep(0.38,1.02,r);"+          /* vignette */
    " float g=fract(sin(dot(vT*uRes+uT,vec2(12.9898,78.233)))*43758.5453);"+
    " c+=(g-0.5)*0.020;"+                              /* film grain */
    " gl_FragColor=vec4(c,1.0); }");
}
function resizePost(){
  ['scene','a','b','c'].forEach(function(k){
    if(FB[k]){ gl.deleteTexture(FB[k].tex); gl.deleteFramebuffer(FB[k].fb); FB[k]=null; }
  });
  var hf = gl.getExtension('OES_texture_half_float');
  var hl = gl.getExtension('OES_texture_half_float_linear');
  HDR = !!(hf && hl);
  var type = HDR ? hf.HALF_FLOAT_OES : gl.UNSIGNED_BYTE;
  var w=cv.width, h=cv.height, hw=Math.max(2,w>>1), hh=Math.max(2,h>>1);
  FB.scene = makeTarget(w,h,type);
  if(!FB.scene && HDR){ HDR=false; FB.scene=makeTarget(w,h,gl.UNSIGNED_BYTE); type=gl.UNSIGNED_BYTE; }
  FB.a = makeTarget(hw,hh,type);
  FB.b = makeTarget(hw,hh,type);
  /* the streak lives at a quarter width: it is a horizontal smear, so vertical
     detail in it is wasted memory and wasted fill */
  FB.c = makeTarget(Math.max(2,w>>2), Math.max(2,h>>2), type);
  POST = !!(FB.scene && FB.a && FB.b);
  STREAK = POST && !!FB.c;
}
function fsQuad(prog){
  gl.useProgram(prog);
  bindAttr(prog.a.aQ,BUF.quad,2);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
function buildStars(){
  var layers=[[1900,82,0.15,[0.74,0.82,1.0]],[900,54,0.25,[1.0,0.90,0.76]],[260,36,0.46,[0.62,0.82,1.0]]];
  var P=[],S=[],C=[],Ph=[];
  layers.forEach(function(L){
    for(var i=0;i<L[0];i++){
      var u=Math.random()*2-1, th=Math.random()*Math.PI*2, r=L[1]*(0.72+Math.random()*0.28);
      var s=Math.sqrt(1-u*u);
      /* bias a third of the stars towards a galactic band instead of a
         uniform shell — a real sky is not evenly sprinkled */
      var y=u*0.6;
      if(Math.random()<0.34) y*=0.22;
      P.push(r*s*Math.cos(th), r*y, r*s*Math.sin(th));
      S.push(L[2]*(0.6+Math.random()*1.0));
      Ph.push(Math.random());
      var j=0.80+Math.random()*0.34;
      C.push(L[3][0]*j, L[3][1]*j, L[3][2]*j);
    }
  });
  BUF.starP=NX.buf(gl,new Float32Array(P));
  BUF.starS=NX.buf(gl,new Float32Array(S));
  BUF.starC=NX.buf(gl,new Float32Array(C));
  BUF.starPh=NX.buf(gl,new Float32Array(Ph));
  GEO.starN=S.length;
}

/* a band of faint clouds around a great circle, so the sky has structure */
var MW=[];
function buildMilkyWay(){
  MW=[];
  for(var i=0;i<10;i++){
    var a=(i/10)*Math.PI*2 + Math.random()*0.28;
    var R=46+Math.random()*22;
    var tilt=0.32;
    var x=Math.cos(a)*R, z=Math.sin(a)*R;
    var y=-z*Math.sin(tilt)+ (Math.random()*2-1)*5.0;
    var warm=Math.random();
    MW.push({ p:[x, y, z*Math.cos(tilt)],
              s:14+Math.random()*15,
              c:[0.26+warm*0.30, 0.22+warm*0.14, 0.52+ (1-warm)*0.30],
              o:0.045+Math.random()*0.055 });
  }
  MW.push({p:[-26,-8,-30],s:34,c:[0.34,0.28,0.92],o:0.16});
  MW.push({p:[29,6,-21], s:29,c:[0.18,0.42,0.86],o:0.14});
  MW.push({p:[6,-12,29], s:33,c:[0.50,0.22,0.72],o:0.11});
}

var ringBase=null, ringArc=null, ringPct=-1, ringVerified=null;
function buildRing(pct, verified){
  if(pct===ringPct && verified===ringVerified) return;
  ringPct=pct; ringVerified=verified;
  var R=0.84;
  if(!ringBase){
    var g=NX.torusArc(R,0.010,Math.PI*2,150,7);
    ringBase={p:NX.buf(gl,g.pos), i:NX.buf(gl,g.idx,gl.ELEMENT_ARRAY_BUFFER), n:g.idx.length};
  }
  var arc=Math.max(0.02, Math.PI*2*pct);
  var ga=NX.torusArc(R,0.026,arc,Math.max(10,Math.round(160*pct)),9);
  if(ringArc){ gl.deleteBuffer(ringArc.p); gl.deleteBuffer(ringArc.i); }
  ringArc={p:NX.buf(gl,ga.pos), i:NX.buf(gl,ga.idx,gl.ELEMENT_ARRAY_BUFFER), n:ga.idx.length};
}

var bodies=[];
function buildBodies(){
  bodies.forEach(function(b){ gl.deleteBuffer(b.orbit); });
  var list = (D.systems||[]).filter(function(s){ return LAYOUT[s.id]; });
  bodies = list.map(function(s,i){
    var L=LAYOUT[s.id];
    var moons=[];
    for(var m=0;m<(L.moons||0);m++){
      moons.push({ d:L.size*2.4+m*L.size*0.9, s:L.size*0.26, a:Math.random()*6.28,
                   v:0.55+Math.random()*0.5, tilt:(Math.random()-0.5)*0.9, pos:[0,0,0] });
    }
    return { def:s, L:L, ang:(i/Math.max(1,list.length))*Math.PI*2+0.5, spin:L.seed,
             col:hex2rgb(L.colour), pip:hex2rgb(stateHex(s.state)), moons:moons,
             trail:[], orbit:NX.buf(gl, NX.circle(L.r,140,L.tilt)), pos:[0,0,0] };
  });

  buildLabels();
}
function hex2rgb(h){ h=h.replace('#','');
  return [parseInt(h.substr(0,2),16)/255, parseInt(h.substr(2,2),16)/255, parseInt(h.substr(4,2),16)/255]; }
function stateHex(s){ return ({ok:'#39e6a4',watch:'#ff9f43',idle:'#7f8fb5',bad:'#ff5d6c'})[s]||'#7f8fb5'; }

/* --- links: faint arcs between neighbouring bodies. Deliberately dim:
   from arm's length you should only see the signal moving along them. --- */
var links=[];
function buildLinks(){
  links.forEach(function(L){ gl.deleteBuffer(L.buf); });
  links=[];
  if(bodies.length<2) return;
  for(var i=0;i<bodies.length;i++){
    var a=bodies[i], b=bodies[(i+1)%bodies.length];
    if(bodies.length===2 && i===1) break;
    links.push({ a:a, b:b, buf:null, n:34, bow:0.30, col:[0.42,0.55,0.80] });
  }
}
function refreshLinkGeometry(){
  for(var i=0;i<links.length;i++){
    var L=links[i];
    var pts=NX.arc(L.a.pos, L.b.pos, L.n, L.bow);
    if(L.buf) gl.deleteBuffer(L.buf);
    L.buf=NX.buf(gl, pts);
  }
}

/* The outer belt is the project's own history: one mark per phase, lit gold
   when that phase is finished and dim when it is not. Every phase that lands
   adds a light, so the system visibly grows outward as the work goes on. */
var STAGE_R = 3.86, STAGE_TILT = 0.05;
function beltR(){ return 3.72 + Math.min(0.55, Math.max(0, stages().length-8)*0.055); }
function stages(){ return Array.isArray(D.stages) ? D.stages : []; }
function drawStages(now){
  var st = stages(); if(!st.length) return;
  var spin = now/48000; STAGE_R = beltR();
  for(var i=0;i<st.length;i++){
    var a = spin + (i/st.length)*Math.PI*2;
    var x=Math.cos(a)*STAGE_R, z0=Math.sin(a)*STAGE_R;
    var pos=[x, -z0*Math.sin(STAGE_TILT), z0*Math.cos(STAGE_TILT)];
    var done = !!st[i].done, cur = !!st[i].current;
    var col = done ? [1.0,0.84,0.46] : [0.36,0.44,0.62];
    var pulse = cur ? (0.7+0.5*Math.abs(Math.sin(now/500))) : 1.0;
    glowQuad(pos, (done?0.16:0.10)*pulse, col, done?0.85:0.30, 3.0);
    if(done) glowQuad(pos, 0.34*pulse, col, 0.16, 2.4);
    if(cur)  ringQuad(pos, 0.30*pulse, [1.0,0.90,0.60], 0.55, 0.10);
  }
}
/* ================= hulls =================
   Ships and the workers at the star used to be glowing dots, and the reason was
   arithmetic, not laziness: at the orbit distance a ship is about fourteen
   pixels across, and no model survives fourteen pixels. So the ships were moved
   instead of shrunk — they now fly through the near field, between the camera
   and the star, where a unit of world is a hundred and forty pixels instead of
   fifty-eight, and a hull reads as a hull.

   Everything below is generated as boxes in JavaScript, the same way the sphere
   already was. No model file, no loader, no CDN — it still opens from a folder
   with the aeroplane mode on.
   ========================================= */
function meshAcc(){ return {p:[],n:[],c:[],e:[],i:[]}; }
function pushQuad(a, v0,v1,v2,v3, col, emi, ctr){
  var base=a.p.length/3;
  var ux=[v1[0]-v0[0],v1[1]-v0[1],v1[2]-v0[2]], uy=[v3[0]-v0[0],v3[1]-v0[1],v3[2]-v0[2]];
  var nx=ux[1]*uy[2]-ux[2]*uy[1], ny=ux[2]*uy[0]-ux[0]*uy[2], nz=ux[0]*uy[1]-ux[1]*uy[0];
  var L=Math.hypot(nx,ny,nz)||1; nx/=L; ny/=L; nz/=L;
  /* nothing is culled here, so winding is free — but the normal has to point
     away from the body or every panel lights from the wrong side */
  if((v0[0]-ctr[0])*nx+(v0[1]-ctr[1])*ny+(v0[2]-ctr[2])*nz < 0){ nx=-nx; ny=-ny; nz=-nz; }
  var vs=[v0,v1,v2,v3];
  for(var k=0;k<4;k++){ a.p.push(vs[k][0],vs[k][1],vs[k][2]); a.n.push(nx,ny,nz);
                        a.c.push(col[0],col[1],col[2]); a.e.push(emi); }
  a.i.push(base,base+1,base+2, base,base+2,base+3);
}
/* a box whose +z face may be narrowed, which is all a nose or a swept wing is */
function pushBox(a, c, h, col, emi, taper){
  var f=(taper===undefined)?1:taper;
  function P(sx,sy,sz){ var s=(sz>0)?f:1;
    return [c[0]+sx*h[0]*s, c[1]+sy*h[1]*s, c[2]+sz*h[2]]; }
  var A=P(-1,-1,-1),B=P(1,-1,-1),C=P(1,1,-1),Dd=P(-1,1,-1);
  var E=P(-1,-1, 1),F=P(1,-1, 1),G=P(1,1, 1),H=P(-1,1, 1);
  pushQuad(a,E,F,G,H,col,emi,c); pushQuad(a,A,B,C,Dd,col,emi,c);
  pushQuad(a,B,F,G,C,col,emi,c); pushQuad(a,E,A,Dd,H,col,emi,c);
  pushQuad(a,H,G,C,Dd,col,emi,c); pushQuad(a,A,B,F,E,col,emi,c);
}
function uploadMesh(a){
  return { p:NX.buf(gl,new Float32Array(a.p)), n:NX.buf(gl,new Float32Array(a.n)),
           c:NX.buf(gl,new Float32Array(a.c)), e:NX.buf(gl,new Float32Array(a.e)),
           i:(function(){ var b=gl.createBuffer();
                gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,b);
                gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(a.i),gl.STATIC_DRAW);
                return b; })(),
           n_i:a.i.length };
}

/* nose down +z, so NX.modelDir points it along its own flight path */
function buildShip(){
  var a=meshAcc();
  var hull=[0.33,0.37,0.45], plate=[0.54,0.59,0.68], dark=[0.13,0.15,0.21];
  pushBox(a,[0,0,0.02],[0.085,0.070,0.40],hull,0,0.34);          /* fuselage, nose tapered */
  pushBox(a,[0,0.080,-0.02],[0.052,0.045,0.17],plate,0,0.55);    /* spine */
  pushBox(a,[0,0.052,0.16],[0.040,0.030,0.075],[0.30,0.62,0.85],0.55,0.6); /* canopy */
  pushBox(a,[ 0.21,-0.010,-0.10],[0.150,0.015,0.185],plate,0,0.30);
  pushBox(a,[-0.21,-0.010,-0.10],[0.150,0.015,0.185],plate,0,0.30);
  pushBox(a,[ 0.345,0,-0.13],[0.026,0.026,0.105],hull,0);
  pushBox(a,[-0.345,0,-0.13],[0.026,0.026,0.105],hull,0);
  pushBox(a,[0,0.115,-0.30],[0.012,0.075,0.075],dark,0,0.5);     /* fin */
  pushBox(a,[ 0.105,-0.020,-0.40],[0.046,0.046,0.070],dark,0);
  pushBox(a,[-0.105,-0.020,-0.40],[0.046,0.046,0.070],dark,0);
  pushBox(a,[ 0.105,-0.020,-0.455],[0.036,0.036,0.012],[0.55,0.85,1.0],1.0); /* thrust */

}
/* a worker: standing on +y, facing +z. Arms are separate so they can move. */
function buildWorker(){
  var b=meshAcc();
  var suit=[0.30,0.36,0.46], trim=[0.62,0.70,0.82];
  pushBox(b,[0,0.30,0],[0.098,0.155,0.070],suit,0,0.86);          /* torso */
  pushBox(b,[0,0.155,0],[0.070,0.030,0.055],trim,0);              /* belt */
  pushBox(b,[0,0.545,0],[0.072,0.082,0.068],suit,0,0.92);         /* helmet */
  pushBox(b,[0,0.545,0.062],[0.050,0.040,0.012],[0.45,0.95,0.80],0.85); /* visor */
  pushBox(b,[ 0.052,0.075,0],[0.031,0.078,0.036],suit,0);         /* legs */
  pushBox(b,[-0.052,0.075,0],[0.031,0.078,0.036],suit,0);
  pushBox(b,[0,0.40,-0.075],[0.055,0.075,0.030],trim,0);          /* pack */
  var arm=meshAcc();
  pushBox(arm,[0,-0.115,0],[0.028,0.118,0.028],[0.34,0.40,0.52],0);
  pushBox(arm,[0,-0.245,0],[0.034,0.026,0.034],[0.95,0.72,0.30],0.90); /* the tool */
  return { body:uploadMesh(b), arm:uploadMesh(arm) };
}

/* translate * rotate-about-x, written straight into a mat4 — a shoulder */
function limbMatrix(px,py,pz, ang, s, o){
  var c=Math.cos(ang), sn=Math.sin(ang);
  o[0]=s; o[1]=0;    o[2]=0;     o[3]=0;
  o[4]=0; o[5]=c*s;  o[6]=sn*s;  o[7]=0;
  o[8]=0; o[9]=-sn*s;o[10]=c*s;  o[11]=0;
  o[12]=px; o[13]=py; o[14]=pz;  o[15]=1;
  return o;
}

/* The hulls are solid, so they need the depth buffer and ordinary blending; the
   engines and the tool sparks are light, so they need neither. The two are drawn
   as two passes rather than interleaved, because switching that state per object
   is how a frame ends up with a ship glowing through a planet. */
function drawFleet(now){
  if(!PROG.hull || !GEO.ship || (!ships.length && !aliens.length)) return;

  gl.disable(gl.BLEND); gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
  gl.useProgram(PROG.hull);
  gl.uniform3fv(PROG.hull.u.uEye, eye);

  for(var s=0; s<ships.length; s++){
    var sh=ships[s], k=sh.size;
    NX.modelDir(sh.pos, sh.dir, [k,k,k], mHull);
    drawHull(GEO.ship, mHull);
  }
  for(var i=0; i<aliens.length; i++){
    var al=aliens[i], sc=1.05;
    /* facing the star, because that is what they are working on */
    NX.modelScale(al.pos, [sc,sc,sc], -al.ang+Math.PI/2, mHull);
    drawHull(GEO.worker.body, mHull);
    /* both arms up at the work, swinging out of phase so it reads as effort */
    var sw=Math.sin(now/380+al.phase);
    for(var arm=0; arm<2; arm++){
      var side=arm? 1 : -1;
      limbMatrix(side*0.118, 0.415, 0.010, -0.72+sw*(arm?0.26:-0.26), 1.0, mHull2);
      NX.mul(mHull, mHull2, mArm);
      drawHull(GEO.worker.arm, mArm);
    }
  }

  /* pass two: the light they make */
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE); gl.depthMask(false);
  for(s=0; s<ships.length; s++){
    var sp=ships[s], d=sp.dir, dl=Math.hypot(d[0],d[1],d[2])||1;
    var ux=d[0]/dl, uy=d[1]/dl, uz=d[2]/dl, kk=sp.size;
    function at(o){ return [sp.pos[0]-ux*kk*o, sp.pos[1]-uy*kk*o, sp.pos[2]-uz*kk*o]; }
    glowQuad(at(0.46), 0.30*kk, sp.glow, 0.95, 3.4);
    glowQuad(at(0.62), 0.44*kk, sp.glow, 0.34, 2.4);
    glowQuad(at(1.15), 0.62*kk, sp.glow, 0.10, 1.8);   /* the wake */
  }
  for(i=0; i<aliens.length; i++){
    var a2=aliens[i], f=Math.sin(Math.min(1,a2.t)*Math.PI);
    var sw2=Math.sin(now/380+a2.phase);
    /* the tool tip, where the arm swings to */
    var tip=[a2.pos[0], a2.pos[1]+0.34+sw2*0.05, a2.pos[2]];
    glowQuad(tip, 0.20, [1.0,0.80,0.36], 0.85*f, 3.6);
    glowQuad(tip, 0.44, [1.0,0.62,0.24], 0.22*f, 2.2);
    glowQuad([a2.pos[0],a2.pos[1]+0.20,a2.pos[2]], 0.62, [0.30,0.95,0.70], 0.10*f, 2.0);
  }
  gl.depthMask(true);
}

var mHull=NX.m4(), mHull2=NX.m4(), mArm=NX.m4();
function drawHull(mesh, M){
  NX.mul(mVP, M, mHull2);
  gl.uniformMatrix4fv(PROG.hull.u.uMVP,false,mHull2);
  gl.uniformMatrix4fv(PROG.hull.u.uM,false,M);
  bindAttr(PROG.hull.a.aP,mesh.p,3); bindAttr(PROG.hull.a.aN,mesh.n,3);
  bindAttr(PROG.hull.a.aC,mesh.c,3); bindAttr(PROG.hull.a.aE,mesh.e,1);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,mesh.i);
  gl.drawElements(gl.TRIANGLES,mesh.n_i,gl.UNSIGNED_SHORT,0);
}

var couriers=[], lastCour=0;
function spawnCourier(){
  if(!bodies.length || couriers.length>7) return;
  /* two thirds of the traffic runs sun -> planet, the rest along the links */
  if(links.length && Math.random()<0.42){
    var L=links[(Math.random()*links.length)|0];
    couriers.push({link:L,t:0,v:0.22+Math.random()*0.16});
  } else {
    var b=bodies[(Math.random()*bodies.length)|0];
    couriers.push({b:b,t:0,v:0.26+Math.random()*0.20});
  }
}

/* --- ships: they cross the field, they do not carry meaning --- */
var ships=[], lastShip=0;
function spawnShip(){
  if(ships.length>2) return;
  /* The path is laid out in front of the lens, not out among the orbits. At the
     orbit distance one world unit is about fifty-eight pixels and a ship is a
     speck; six units in front of the camera the same unit is a hundred and
     forty, and the same hull is a ship crossing the frame. The camera keeps
     turning after this, and the path does not follow it — which is right: it was
     a real path through the world, not a decal stuck to the screen. */
  var fx=camLook[0]-eye[0], fy=camLook[1]-eye[1], fz=camLook[2]-eye[2];
  var fl=Math.hypot(fx,fy,fz)||1; fx/=fl; fy/=fl; fz/=fl;
  var depth=5.4+Math.random()*3.4;
  /* How wide the frame actually is in world units at that depth — measured off
     the lens, not picked. The first version used a fixed span of five units and
     the ships spent seven eighths of every crossing outside the picture. */
  var halfH=depth*Math.tan(FOV/2), halfW=halfH*(W/H);
  var span=halfW*1.42, upRange=halfH*0.62;
  var side=Math.random()<0.5?-1:1;
  var up=(Math.random()*2-1)*upRange, tilt=(Math.random()*2-1)*halfH*0.30;
  var C=[eye[0]+fx*depth, eye[1]+fy*depth, eye[2]+fz*depth];
  function pt(k,u){ return [C[0]+camRight[0]*k+camUp[0]*u,
                            C[1]+camRight[1]*k+camUp[1]*u,
                            C[2]+camRight[2]*k+camUp[2]*u]; }
  ships.push({ from:pt(side*span,up), to:pt(-side*span,up+tilt),
               t:0, v:0.15+Math.random()*0.11, bow:0.06+Math.random()*0.10,
               size:0.30+Math.random()*0.22,
               col:[0.62,0.70,0.86], glow:[0.45,0.80,1.0], pos:[0,0,0], dir:[0,0,1] });
}

/* --- couriers of meaning: a saucer carries one real line and leaves --- */
var aliens=[], lastAlien=0, voiceIx=0;
function voices(){
  if(Array.isArray(D.voices) && D.voices.length) return D.voices;
  var out=[];
  (D.log||[]).forEach(function(e){ if(e && e.h) out.push(e.h); });
  (D.systems||[]).forEach(function(x){ if(x && x.name && x.val) out.push(x.name+': '+x.val); });
  return out;
}
/* The workers at the star. They used to drift past the top of the frame as two
   glowing blobs with a caption; now they stand on the star, face it, and work at
   it with a lit tool. Their sentences are not decoration and never were — every
   one comes out of voices(), which reads the measured log and the measured
   systems that phone_state.py wrote. A worker cannot say anything nobody
   measured. */
function spawnAlien(){
  if(aliens.length>2) return;
  var v=voices(); if(!v.length) return;
  var txt=v[voiceIx % v.length]; voiceIx++;
  var el=document.createElement('div');
  el.className='bub'; el.textContent=txt;
  document.getElementById('labels').appendChild(el);
  aliens.push({ ang:Math.random()*6.2832, r:SUN_R*(2.70+Math.random()*0.85),
                y:(Math.random()*2-1)*SUN_R*1.15,
                drift:(Math.random()<0.5?-1:1)*(0.09+Math.random()*0.11),
                t:0, v:0.020+Math.random()*0.008,
                phase:Math.random()*6.2832, pos:[0,0,0], el:el });
}

/* ---------------- draw ---------------- */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1, 2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  gl.viewport(0,0,cv.width,cv.height);
  if(PROG.bright) resizePost();
  var portrait = H>W;
  FOV = (portrait ? 58 : 46) * Math.PI/180;
  NX.perspective(FOV, W/H, 0.1, 300, mP);
  /* the headline card owns the top of a phone screen, so the sun is placed
     below centre rather than behind it */
  mP[9] = portrait ? 0.20 : 0.06;
  camState.tDist = baseDist();
}
function baseDist(){ return window.innerHeight>window.innerWidth ? 14.4 : 11.6; }

function draw(now, dt){
  camState.az += (camState.tAz-camState.az)*Math.min(1,dt*7);
  camState.el += (camState.tEl-camState.el)*Math.min(1,dt*7);
  camState.dist += (camState.tDist-camState.dist)*Math.min(1,dt*5);
  /* the look-at point eases toward whatever is in focus, so tapping a planet
     flies to it instead of cutting, and letting go drifts back to the sun */
  var tgt = focus ? focus.pos : [0,0,0];
  var k = Math.min(1, dt*3.2);
  camLook[0]+=(tgt[0]-camLook[0])*k; camLook[1]+=(tgt[1]-camLook[1])*k; camLook[2]+=(tgt[2]-camLook[2])*k;
  var ce=Math.cos(camState.el), se=Math.sin(camState.el);
  eye[0]=camLook[0]+Math.cos(camState.az)*ce*camState.dist;
  eye[1]=camLook[1]+se*camState.dist;
  eye[2]=camLook[2]+Math.sin(camState.az)*ce*camState.dist;
  shiftNow += (shiftTo-shiftNow)*Math.min(1,dt*3.2);
  mP[9] = shiftNow;
  /* the sideways twin of shiftNow: only the brain view uses it, to get the head
     out from behind the panel when the phone is on its side. It is written every
     frame, including the zero, so it cannot leak into another view. */
  shiftX += ((view==='brain' ? brainFrame().x : 0) - shiftX)*Math.min(1,dt*3.2);
  mP[8] = shiftX;
  NX.lookAt(eye,camLook,[0,1,0],mV);
  NX.mul(mP,mV,mVP);
  camRight[0]=mV[0]; camRight[1]=mV[4]; camRight[2]=mV[8];
  camUp[0]=mV[1];    camUp[1]=mV[5];    camUp[2]=mV[9];

  var usePost = POST;   /* the grade stays even on a weak phone */
  if(usePost){
    gl.bindFramebuffer(gl.FRAMEBUFFER, FB.scene.fb);
    gl.viewport(0,0,FB.scene.w,FB.scene.h);
  }
  gl.clearColor(0.016,0.024,0.059,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);

  gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);
  gl.useProgram(PROG.bg);
  bindAttr(PROG.bg.a.aQ,BUF.quad,2);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
  for(var mi=0; mi<MW.length; mi++){ if(!QUAL && mi>=4) break;
    var nb=MW[mi]; glowQuad(nb.p,nb.s,nb.c,nb.o*0.55,1.6); }

  gl.useProgram(PROG.star);
  gl.uniformMatrix4fv(PROG.star.u.uV,false,mV);
  gl.uniformMatrix4fv(PROG.star.u.uP,false,mP);
  gl.uniform1f(PROG.star.u.uPix, cv.height*0.5/Math.tan(FOV/2));
  gl.uniform1f(PROG.star.u.uT, now/1000);
  bindAttr(PROG.star.a.aP,BUF.starP,3);
  bindAttr(PROG.star.a.aS,BUF.starS,1);
  bindAttr(PROG.star.a.aPh,BUF.starPh,1);
  bindAttr(PROG.star.a.aC,BUF.starC,3);
  gl.drawArrays(gl.POINTS,0,GEO.starN);

  /* One canvas, two scenes. The solar system is the project seen from outside;
     the brain is the same project seen from inside. Exactly one is drawn, so a
     phone never pays for the scene it is not looking at. */
  if(view==='brain') drawBrain(now, dt);
  else drawSolar(now, dt);

  if(usePost){
    gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);
    /* bright pass into the half-size target */
    gl.bindFramebuffer(gl.FRAMEBUFFER, FB.a.fb);
    gl.viewport(0,0,FB.a.w,FB.a.h);
    gl.useProgram(PROG.bright);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, FB.scene.tex);
    gl.uniform1i(PROG.bright.u.uS,0);
    /* The threshold has to match the scene, not a memory of another one. It was set
       for a star that outputs values over two; the brain's brightest point is well
       under one, so at 1.30 nothing in the head ever reached the bloom and the
       organ came out grey. This is the board's own number. */
    gl.uniform1f(PROG.bright.u.uThr, view==='brain' ? 0.70 : (HDR?1.30:0.86));
    fsQuad(PROG.bright);
    /* two separable blurs, twice, so the spill is wide and soft */
    for(var bp=0; bp<(QUAL?2:1); bp++){
      var rad = bp===0 ? 1.0 : 2.2;
      gl.bindFramebuffer(gl.FRAMEBUFFER, FB.b.fb);
      gl.useProgram(PROG.blur);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, FB.a.tex);
      gl.uniform1i(PROG.blur.u.uS,0);
      gl.uniform2f(PROG.blur.u.uDir, rad/FB.a.w, 0);
      fsQuad(PROG.blur);
      gl.bindFramebuffer(gl.FRAMEBUFFER, FB.a.fb);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, FB.b.tex);
      gl.uniform2f(PROG.blur.u.uDir, 0, rad/FB.a.h);
      fsQuad(PROG.blur);
    }
    /* the streak: two horizontal-only passes off the finished bloom. Horizontal
       only — that is the whole point, and it is why it can live at quarter size. */
    /* Not gated on QUAL. Three quarter-size horizontal passes are cheap, and the
       project's own rule is that adaptive quality may drop the corona and the
       nebulae but never the grade — the streak is the grade. */
    var doStreak = STREAK;
    if(doStreak){
      gl.bindFramebuffer(gl.FRAMEBUFFER, FB.c.fb);
      gl.viewport(0,0,FB.c.w,FB.c.h);
      gl.useProgram(PROG.blur);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, FB.a.tex);
      gl.uniform1i(PROG.blur.u.uS,0);
      gl.uniform2f(PROG.blur.u.uDir, 5.0/FB.c.w, 0);
      fsQuad(PROG.blur);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, FB.b.tex);
      gl.bindFramebuffer(gl.FRAMEBUFFER, FB.b.fb);
      gl.viewport(0,0,FB.b.w,FB.b.h);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, FB.c.tex);
      gl.uniform2f(PROG.blur.u.uDir, 16.0/FB.b.w, 0);
      fsQuad(PROG.blur);
      gl.bindFramebuffer(gl.FRAMEBUFFER, FB.c.fb);
      gl.viewport(0,0,FB.c.w,FB.c.h);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, FB.b.tex);
      gl.uniform2f(PROG.blur.u.uDir, 40.0/FB.c.w, 0);
      fsQuad(PROG.blur);
    }

    /* composite to the screen */
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0,0,cv.width,cv.height);
    gl.useProgram(PROG.post);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, FB.scene.tex);
    gl.uniform1i(PROG.post.u.uScene,0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, FB.a.tex);
    gl.uniform1i(PROG.post.u.uBloom,1);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, (doStreak?FB.c:FB.a).tex);
    gl.uniform1i(PROG.post.u.uStreak,2);
    gl.uniform1f(PROG.post.u.uStr, doStreak ? (HDR?0.50:0.38) : 0.0);
    gl.uniform1f(PROG.post.u.uAmt, HDR?0.42:0.34);
    gl.uniform1f(PROG.post.u.uT, (now%10000)/1000);
    gl.uniform2f(PROG.post.u.uRes, cv.width, cv.height);
    fsQuad(PROG.post);
    gl.activeTexture(gl.TEXTURE0);
    gl.enable(gl.DEPTH_TEST);
  }
}

/* ---------------- the brain ----------------
   The same organ the board on the PC draws, and deliberately the same code
   path: the shape comes out of geom.js, the surface out of the shaders below,
   and both are copied from the desktop board rather than reinvented — two
   screens that draw the same thing from two different sets of arithmetic drift
   apart within a week.

   The SHAPE is arithmetic and is solved here on the device. The WORDS — the
   domain names, what is done — are content, and content only ever reaches this
   page inside the encrypted state. With no words the head still draws and the
   panel says plainly that the rest has not arrived. It never guesses.
   ------------------------------------------ */
var BR=null, BR_WANT=false, BR_MESH=null, BR_SHELL=null, BR_NP=90;

function brainData(){
  var b = D && D.brain;
  return (b && b.cells && b.cells.length && b.domains && b.domains.length) ? b : null;
}

function brainPrograms(){
  if(PROG.bpt) return;
  PROG.bpt = NX.program(gl,
    "attribute vec3 aPos; attribute vec3 aCol; attribute vec2 aMeta; attribute float aOn;"+
    "uniform mat4 uMVP; uniform float uPx; uniform vec3 uEye;"+
    "varying vec3 vCol; varying float vKind; varying float vOn;"+
    "void main(){ vec4 p=uMVP*vec4(aPos,1.0); gl_Position=p;"+
    "  float w=max(p.w,0.08);"+
    "  gl_PointSize=clamp(uPx*aMeta.x/w, 1.0, 58.0);"+
    /* the skin is lit like a surface, not sprayed like confetti */
    "  float sh=1.0;"+
    "  if(aMeta.y>1.5){ vec3 n=normalize(aPos); vec3 vd=normalize(uEye-aPos);"+
    "    float f=dot(n,vd); float rim=pow(1.0-abs(f),1.45);"+
    "    sh = (f>0.0) ? (0.46+1.25*rim) : (0.07+0.34*rim); }"+
    "  vCol=aCol; vKind=aMeta.y; vOn=aOn*sh; }",
    "precision mediump float;"+
    "varying vec3 vCol; varying float vKind; varying float vOn;"+
    "void main(){ vec2 q=gl_PointCoord*2.0-1.0; float r=length(q); if(r>1.0) discard;"+
    "  float a;"+
    "  if(vKind>1.5){ a=exp(-r*r*3.4)*0.92; }"+
    "  else if(vKind>0.5){ a=(exp(-r*r*6.5)+exp(-r*r*1.7)*0.32)*1.38; }"+
    "  else if(vKind>2.5){ float ring=exp(-pow((r-0.72)/0.11,2.0));"+
    "    a=(exp(-r*r*5.0)*0.50+ring*0.78)*1.08; }"+
    "  else { float ring=exp(-pow((r-0.66)/0.18,2.0)); a=ring*1.05+exp(-r*r*9.0)*0.18; }"+
    "  a*=vOn; if(a<=0.002) discard;"+
    "  gl_FragColor=vec4(vCol*a, a); }");
  PROG.bln = NX.program(gl,
    "attribute vec3 aPos; attribute vec3 aCol; attribute float aOn;"+
    "uniform mat4 uMVP; varying vec3 vCol; varying float vOn;"+
    "void main(){ gl_Position=uMVP*vec4(aPos,1.0); vCol=aCol; vOn=aOn; }",
    "precision mediump float; varying vec3 vCol; varying float vOn;"+
    "void main(){ gl_FragColor=vec4(vCol*vOn, vOn); }");
  /* the organ: glass, lit from two sides, brighter where the work is done */
  PROG.bms = NX.program(gl,
    "attribute vec3 aPos; attribute vec3 aNrm; attribute vec3 aCol; attribute float aF;"+
    "uniform mat4 uMVP;"+
    "varying vec3 vN; varying vec3 vP; varying vec3 vC; varying float vF;"+
    "void main(){ vN=aNrm; vP=aPos; vC=aCol; vF=aF; gl_Position=uMVP*vec4(aPos,1.0); }",
    "precision highp float;"+
    "varying vec3 vN; varying vec3 vP; varying vec3 vC; varying float vF;"+
    "uniform vec3 uEye; uniform float uFace;"+
    "void main(){"+
    "  vec3 N=normalize(vN); vec3 V=normalize(uEye-vP);"+
    "  if(uFace<0.5) N=-N;"+
    "  float fres=pow(1.0-clamp(dot(N,V),0.0,1.0), 2.05);"+
    "  vec3 L1=normalize(vec3(0.42,0.86,0.62)), L2=normalize(vec3(-0.78,-0.16,-0.42));"+
    "  float d1=max(dot(N,L1),0.0), d2=max(dot(N,L2),0.0);"+
    "  vec3 c = vec3(0.078,0.104,0.242)*(0.03+1.70*d1) + vec3(0.140,0.048,0.222)*d2*0.72;"+
    "  vec3 H=normalize(L1+V); float sp=pow(max(dot(N,H),0.0),44.0);"+
    "  c += vec3(0.55,0.72,1.0)*sp*0.38;"+
    "  c += vC*(0.26+0.80*fres);"+
    "  c += vec3(0.36,0.60,1.0)*fres*0.30;"+
    /* the fissure is a shadow in the shader, never a cut in the geometry */
    "  float mid=smoothstep(0.0,0.115,abs(vP.x));"+
    "  float fis = (vP.y>0.02) ? (0.20+0.80*mid) : 1.0;"+
    "  c *= fis * (0.38+0.62*vF);"+
    "  float a = (0.016 + 0.58*fres) * (0.35+0.65*fis);"+
    "  a *= (uFace<0.5 ? 0.17 : 1.0);"+
    "  gl_FragColor=vec4(c*a, a); }");
}

/* The heavy part: about nineteen thousand surface points, each found by
   marching a ray until the field flips. It costs the better part of a second,
   so it happens once, the first time the head is actually asked for — nobody
   pays for a view they never opened. */
function buildBrain(){
  if(typeof NXGEOM==='undefined') return null;
  var bd=brainData();
  var key = bd ? bd.cells.map(function(c){ return c.id+(c.d===true?'1':c.d==='pre'?'p':'0'); }).join(',') : '-';
  if(BR && BR.key===key) return BR;
  brainPrograms();
  if(!BR_MESH){ BR_MESH=NXGEOM.buildMesh(); BR_SHELL=NXGEOM.buildShell(); }
  var MESH=BR_MESH, SHELL=BR_SHELL;

  var DC={}; if(bd) bd.domains.forEach(function(d){ DC[d.k]=d; });
  var colOf=function(k){ return hex2rgb((DC[k]||{c:'#8fa6cf'}).c); };

  /* cells, in the board's order: done first, then prior work, then waiting */
  var C=[];
  if(bd){
    var rank=function(c){ return c.d===true?0:(c.d==='pre'?1:2); };
    bd.cells.map(function(c,i){ return {c:c,i:i}; })
      .sort(function(a,b){ return rank(a.c)-rank(b.c) || a.i-b.i; })
      .forEach(function(o){
        var c=o.c;
        C.push({ id:c.id, dom:c.dom, done:c.d===true, pre:c.d==='pre',
                 lit:(c.d===true||c.d==='pre'), p:NXGEOM.place(c,o.i),
                 col:colOf(c.dom) });
      });
  }
  var tal={}, done=0, pre=0;
  if(bd) bd.domains.forEach(function(d){ tal[d.k]={done:0,pre:0,tot:0}; });
  C.forEach(function(c){ var t=tal[c.dom];
    if(t){ t.tot++; if(c.done)t.done++; if(c.pre)t.pre++; }
    if(c.done)done++; if(c.pre)pre++; });

  /* axons: each cell reaches for its two nearest neighbours in its own domain,
     plus a few long fibres across the midline so the halves read as one organ */
  var EDGES=[];
  (function(){
    var seen={};
    for(var i=0;i<C.length;i++){
      var best=[];
      for(var j=0;j<C.length;j++){
        if(i===j || C[j].dom!==C[i].dom) continue;
        var dx=C[i].p[0]-C[j].p[0], dy=C[i].p[1]-C[j].p[1], dz=C[i].p[2]-C[j].p[2];
        best.push({j:j,d:dx*dx+dy*dy+dz*dz});
      }
      best.sort(function(a,b){ return a.d-b.d; });
      for(var k=0;k<Math.min(2,best.length);k++){
        var a=Math.min(i,best[k].j), b=Math.max(i,best[k].j), key2=a+'_'+b;
        if(seen[key2]) continue; seen[key2]=1;
        EDGES.push({a:a,b:b});
      }
    }
    var r=NXGEOM.rng(9137);
    for(var n=0;n<26;n++){
      var a2=(r()*C.length)|0, b2=(r()*C.length)|0;
      if(a2===b2 || !C[a2] || !C[b2] || C[a2].p[0]*C[b2].p[0]>0) continue;
      EDGES.push({a:Math.min(a2,b2), b:Math.max(a2,b2), cross:true});
    }
  })();

  /* the skin takes its colour from how far its own domain has got */
  var mcol=new Float32Array(MESH.n*3);
  for(var i=0;i<MESH.n;i++){
    var t2=tal[MESH.dom[i]]||{done:0,pre:0,tot:1};
    var pr=t2.tot?(t2.done+t2.pre)/t2.tot:0, c2=colOf(MESH.dom[i]), kk=0.030+0.230*pr;
    mcol[i*3]=c2[0]*kk; mcol[i*3+1]=c2[1]*kk; mcol[i*3+2]=c2[2]*kk;
  }

  var nCell=C.length, nDust=SHELL.length, nEdge=EDGES.length;
  var cp=new Float32Array(nCell*3), cc=new Float32Array(nCell*3), cm=new Float32Array(nCell*2), co=new Float32Array(nCell);
  C.forEach(function(c,i){
    cp[i*3]=c.p[0]; cp[i*3+1]=c.p[1]; cp[i*3+2]=c.p[2];
    cc[i*3]=c.col[0]; cc[i*3+1]=c.col[1]; cc[i*3+2]=c.col[2];
    cm[i*2]=c.done?0.98:(c.pre?0.90:0.92); cm[i*2+1]=c.done?1:(c.pre?3:0);
  });
  var dp=new Float32Array(nDust*3), dc=new Float32Array(nDust*3), dm=new Float32Array(nDust*2), doo=new Float32Array(nDust);
  SHELL.forEach(function(s,i){
    dp[i*3]=s.x; dp[i*3+1]=s.y; dp[i*3+2]=s.z;
    var c3=colOf(s.dom), f=0.40+Math.pow(s.f,1.5)*0.80, mixw=0.52;
    dc[i*3]  =(c3[0]*(1-mixw)+0.60*mixw)*f;
    dc[i*3+1]=(c3[1]*(1-mixw)+0.64*mixw)*f;
    dc[i*3+2]=(c3[2]*(1-mixw)+0.78*mixw)*f;
    dm[i*2]=0.070+s.f*0.080; dm[i*2+1]=2;
  });
  var ep=new Float32Array(nEdge*6), ec=new Float32Array(nEdge*6), eo=new Float32Array(nEdge*2);
  EDGES.forEach(function(e,i){
    var A=C[e.a], B2=C[e.b];
    for(var k2=0;k2<3;k2++){ ep[i*6+k2]=A.p[k2]; ep[i*6+3+k2]=B2.p[k2];
                             ec[i*6+k2]=A.col[k2]; ec[i*6+3+k2]=B2.col[k2]; }
  });
  var pulse=[], pp=new Float32Array(BR_NP*3), pc=new Float32Array(BR_NP*3), pm=new Float32Array(BR_NP*2), po=new Float32Array(BR_NP);
  for(var q=0;q<BR_NP;q++){ pulse.push({e:(Math.random()*Math.max(1,nEdge))|0, t:Math.random(), v:0.26+Math.random()*0.5});
                            pm[q*2]=0.26; pm[q*2+1]=1; }

  if(BR && BR.buf) for(var b3 in BR.buf) gl.deleteBuffer(BR.buf[b3]);
  var mi=gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,mi);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,MESH.idx,gl.STATIC_DRAW);

  BR={ key:key, C:C, EDGES:EDGES, tal:tal, done:done, pre:pre, cells:nCell,
       nDust:nDust, nEdge:nEdge, pulse:pulse, ni:MESH.ni, t0:performance.now(),
       arr:{ co:co, doo:doo, eo:eo, pp:pp, pc:pc, po:po },
       buf:{ mp:NX.buf(gl,MESH.pos), mn:NX.buf(gl,MESH.nrm), mc:NX.buf(gl,mcol), mf:NX.buf(gl,MESH.fld),
             cp:NX.buf(gl,cp), cc:NX.buf(gl,cc), cm:NX.buf(gl,cm), co:NX.buf(gl,co),
             dp:NX.buf(gl,dp), dc:NX.buf(gl,dc), dm:NX.buf(gl,dm), doo:NX.buf(gl,doo),
             ep:NX.buf(gl,ep), ec:NX.buf(gl,ec), eo:NX.buf(gl,eo),
             pp:NX.buf(gl,pp), pc:NX.buf(gl,pc), pm:NX.buf(gl,pm), po:NX.buf(gl,po) },
       mi:mi };
  return BR;
}

function bupd(b,a){ gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,a,gl.DYNAMIC_DRAW); }
function battr(prog,name,b,size){
  var l=prog.a[name]; if(l===undefined||l<0) return;
  gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.enableVertexAttribArray(l);
  gl.vertexAttribPointer(l,size,gl.FLOAT,false,0,0);
}
function bpoints(bf,cb,mb,ob,n){
  gl.useProgram(PROG.bpt);
  gl.uniformMatrix4fv(PROG.bpt.u.uMVP,false,mVP);
  gl.uniform1f(PROG.bpt.u.uPx, 0.055*cv.height);
  gl.uniform3fv(PROG.bpt.u.uEye, eye);
  battr(PROG.bpt,'aPos',bf,3); battr(PROG.bpt,'aCol',cb,3);
  battr(PROG.bpt,'aMeta',mb,2); battr(PROG.bpt,'aOn',ob,1);
  gl.drawArrays(gl.POINTS,0,n);
}
function bmesh(front){
  gl.useProgram(PROG.bms);
  gl.uniformMatrix4fv(PROG.bms.u.uMVP,false,mVP);
  gl.uniform3fv(PROG.bms.u.uEye, eye);
  gl.uniform1f(PROG.bms.u.uFace, front?1:0);
  battr(PROG.bms,'aPos',BR.buf.mp,3); battr(PROG.bms,'aNrm',BR.buf.mn,3);
  battr(PROG.bms,'aCol',BR.buf.mc,3); battr(PROG.bms,'aF',BR.buf.mf,1);
  gl.enable(gl.CULL_FACE); gl.cullFace(front? gl.BACK : gl.FRONT);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,BR.mi);
  gl.drawElements(gl.TRIANGLES,BR.ni,gl.UNSIGNED_SHORT,0);
  gl.disable(gl.CULL_FACE);
}

/* Where the head sits so the panel does not cover it. The head is about 1.35
   across and sits at the origin, so these come off the lens — upright the panel
   is a card along the bottom and the head is pushed up; on its side the panel is
   a column down the left and the head goes right. */
function brainFrame(){
  var land = window.innerHeight <= 560 && window.innerWidth > window.innerHeight;
  /* with the panel gone the head owns the whole screen and sits in the middle;
     with the panel up it is pushed clear of it */
  if(BARE) return { dist: 4.6, y: 0.0, x: 0 };
  return land ? { dist: 5.2, y: 0.02, x: -0.46 }
              : { dist: 6.1, y:-0.34, x: 0 };
}
var BARE=false;
function brainBare(on){
  BARE=!!on;
  document.getElementById('brain').classList.toggle('away',BARE);
  document.getElementById('nav').classList.toggle('away',BARE);
  document.getElementById('bhint').classList.toggle('on',BARE);
  var f=brainFrame(); shiftTo=f.y; camState.tDist=f.dist;
}

function drawBrain(now, dt){
  var b=buildBrain();
  if(!b) return;
  var t=(now-b.t0)/1000, A=b.arr;

  /* the head arrives rather than appearing: cells light in the order they were
     finished, so the picture builds itself the way the project did */
  for(var i=0;i<b.C.length;i++){
    var c=b.C[i];
    var want=(t>0.35+i*0.010)?1:0;
    c.vis=(c.vis===undefined?0:c.vis); c.vis+=(want-c.vis)*Math.min(1,dt*3.2);
    var up=c.done?(0.86+0.14*Math.sin(t*1.5+i*0.9)):(c.pre?0.66:0.52);
    A.co[i]=c.vis*up;
  }
  bupd(b.buf.co,A.co);
  var reveal=Math.min(1,Math.max(0,(t-0.2)/2.2));
  for(i=0;i<b.nDust;i++) A.doo[i]=reveal*0.30;
  bupd(b.buf.doo,A.doo);
  for(var e=0;e<b.nEdge;e++){
    var ed=b.EDGES[e], ca=b.C[ed.a], cb=b.C[ed.b];
    var base=(ca.lit&&cb.lit)?0.095:0.032; if(ed.cross) base*=0.7;
    var v=Math.min(ca.vis||0,cb.vis||0)*base;
    A.eo[e*2]=v; A.eo[e*2+1]=v;
  }
  bupd(b.buf.eo,A.eo);
  for(var q=0;q<BR_NP;q++){
    var pu=b.pulse[q]; pu.t+=dt*pu.v;
    if(pu.t>1){ pu.t=0; pu.e=(Math.random()*Math.max(1,b.nEdge))|0; }
    var ee=b.EDGES[pu.e]; if(!ee){ A.po[q]=0; continue; }
    var P1=b.C[ee.a], P2=b.C[ee.b], u=pu.t;
    A.pp[q*3]  =P1.p[0]+(P2.p[0]-P1.p[0])*u;
    A.pp[q*3+1]=P1.p[1]+(P2.p[1]-P1.p[1])*u;
    A.pp[q*3+2]=P1.p[2]+(P2.p[2]-P1.p[2])*u;
    for(var k=0;k<3;k++) A.pc[q*3+k]=P1.col[k]*(1-u)+P2.col[k]*u;
    A.po[q]=Math.sin(u*3.14159)*0.85*Math.min(P1.vis||0,P2.vis||0)*((P1.lit&&P2.lit)?1:0.35);
  }
  bupd(b.buf.pp,A.pp); bupd(b.buf.pc,A.pc); bupd(b.buf.po,A.po);

  gl.disable(gl.DEPTH_TEST); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
  bmesh(false);
  bpoints(b.buf.dp,b.buf.dc,b.buf.dm,b.buf.doo,b.nDust);
  gl.useProgram(PROG.bln);
  gl.uniformMatrix4fv(PROG.bln.u.uMVP,false,mVP);
  battr(PROG.bln,'aPos',b.buf.ep,3); battr(PROG.bln,'aCol',b.buf.ec,3); battr(PROG.bln,'aOn',b.buf.eo,1);
  gl.drawArrays(gl.LINES,0,b.nEdge*2);
  bpoints(b.buf.pp,b.buf.pc,b.buf.pm,b.buf.po,BR_NP);
  bpoints(b.buf.cp,b.buf.cc,b.buf.cm,b.buf.co,b.cells);
  bmesh(true);
  gl.enable(gl.DEPTH_TEST);
}

function paintBrainPanel(){
  var box=document.querySelector('#brain .box'); if(!box) return;
  var bd=brainData();
  if(!bd){
    box.innerHTML='<div class="none"><b>המוח עוד לא משודר.</b><br>' +
      'הצורה שרואים היא הצורה האמיתית — היא מחושבת כאן במכשיר. ' +
      'השמות והמספרים יושבים על המחשב, והם מגיעים רק כשהמשדר רץ. ' +
      'הרץ את כפתור 13 והם יופיעו כאן לבד.</div>';
    return;
  }
  var b=buildBrain(); if(!b) return;
  var tot=b.cells, lit=b.done+b.pre, pct=tot?Math.round(lit/tot*100):0;

  /* The two runners, at the top, because they are the only things on this
     screen that can be dead right now. They are not equal and are not drawn as
     if they were: the engine has a real pulse it writes every few minutes, so
     "alive" is a measurement. The eye has no pulse — all it leaves behind is
     when its last build finished — so it is labelled as the last build and
     never as a heartbeat. Calling that a pulse would be inventing one. */
  var sysById={}; (D.systems||[]).forEach(function(x){ sysById[x.id]=x; });
  var runner=function(sys, name, kind){
    if(!sys) return '<div class="rn off"><i></i><span class="k">'+name+'</span>'+
                    '<span class="v">לא נמדד</span></div>';
    var cls={ok:'ok',watch:'warn',bad:'bad',idle:'off'}[sys.state]||'off';
    return '<div class="rn '+cls+'"><i></i><span class="k">'+name+'</span>'+
           '<span class="v">'+esc(sys.val||'')+'</span>'+
           '<span class="w">'+kind+'</span></div>';
  };
  var h='<div class="run">'+
        runner(sysById.code,'קלוד קוד','דופק חי')+
        runner(sysById.eye,'העין','בנייה אחרונה')+
        '</div>'+
        '<div class="ttl"><b>המוח</b><span>כל נקודה היא משימה אמיתית</span>'+
        '<span class="pc">'+pct+'%</span></div>'+
        '<div class="sum">'+lit+' תאים קיימים מתוך '+tot+'. <b style="color:var(--ink)">'+b.done+
        '</b> אומתו · '+b.pre+' נבנו קודם · '+(tot-lit)+' ממתינים.</div><div class="rows">';
  bd.domains.forEach(function(d){
    var t=b.tal[d.k]||{done:0,pre:0,tot:0};
    var p=t.tot?t.done/t.tot*100:0, q=t.tot?t.pre/t.tot*100:0;
    h+='<div class="r"><div class="top"><span class="dot" style="background:'+d.c+';color:'+d.c+'"></span>'+
       '<span class="nm">'+d.he+'</span><span class="ct">'+(t.done+t.pre)+'/'+t.tot+'</span></div>'+
       '<div class="bar"><i style="width:'+p.toFixed(0)+'%;background:'+d.c+'"></i>'+
       '<i style="width:'+q.toFixed(0)+'%;background:'+d.c+';opacity:.34"></i></div></div>';
  });
  box.innerHTML=h+'</div>';
}

/* ---------------- the solar system ---------------- */
function drawSolar(now, dt){
    var pulse=1+Math.sin(now/900)*0.045;
    if(QUAL) coronaQuad(8.4*SUN_R*pulse, [1.0,0.68,0.32], 0.26, now/1000);
    glowQuad([0,0,0], 7.4*pulse, [1.0,0.58,0.22], QUAL?0.17:0.26, 2.6);
    glowQuad([0,0,0], 3.6*pulse,  [1.0,0.82,0.44], 0.38, 3.4);
    glowQuad([0,0,0], 1.6*pulse,  [1.0,0.94,0.72], 0.45, 5.0);

    gl.enable(gl.DEPTH_TEST); gl.depthMask(false);
    gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(PROG.solid);
    gl.uniformMatrix4fv(PROG.solid.u.uMVP,false,mVP);
    bodies.forEach(function(b){
      gl.uniform3fv(PROG.solid.u.uC,b.col);
      gl.uniform1f(PROG.solid.u.uO,0.13);
      bindAttr(PROG.solid.a.aP,b.orbit,3);
      gl.drawArrays(gl.LINE_LOOP,0,140);
    });

    if(stages().length){
      if(BUF.stageRingR !== beltR()){ if(BUF.stageRing) gl.deleteBuffer(BUF.stageRing);
        BUF.stageRingR = beltR(); BUF.stageRing = NX.buf(gl, NX.circle(BUF.stageRingR,150,STAGE_TILT)); }
      gl.uniform3f(PROG.solid.u.uC, 0.85,0.72,0.42);
      gl.uniform1f(PROG.solid.u.uO, 0.10);
      bindAttr(PROG.solid.a.aP, BUF.stageRing, 3);
      gl.drawArrays(gl.LINE_LOOP,0,150);
    }

    /* the links themselves stay almost invisible on purpose */
    for(var li=0; li<links.length; li++){
      var L=links[li]; if(!L.buf) continue;
      gl.uniform3fv(PROG.solid.u.uC, L.col);
      gl.uniform1f(PROG.solid.u.uO, 0.18);
      bindAttr(PROG.solid.a.aP, L.buf, 3);
      gl.drawArrays(gl.LINE_STRIP, 0, L.n+1);
    }

    /* a short wake behind each planet */
    bodies.forEach(function(b){
      if(b.trail.length<6) return;
      var arr=new Float32Array(b.trail.length*3);
      for(var i=0;i<b.trail.length;i++){ arr[i*3]=b.trail[i][0]; arr[i*3+1]=b.trail[i][1]; arr[i*3+2]=b.trail[i][2]; }
      gl.bindBuffer(gl.ARRAY_BUFFER, BUF.dyn);
      gl.bufferData(gl.ARRAY_BUFFER, arr, gl.DYNAMIC_DRAW);
      gl.enableVertexAttribArray(PROG.solid.a.aP);
      gl.vertexAttribPointer(PROG.solid.a.aP,3,gl.FLOAT,false,0,0);
      gl.uniform3fv(PROG.solid.u.uC,b.col);
      gl.uniform1f(PROG.solid.u.uO,0.22);
      gl.drawArrays(gl.LINE_STRIP,0,b.trail.length);
    });
    gl.depthMask(true);

    gl.disable(gl.BLEND);
    gl.useProgram(PROG.sun);
    NX.model(0,0,0, now/9000, SUN_R, 0, mM);
    NX.mul(mVP,mM,mMVP);
    gl.uniformMatrix4fv(PROG.sun.u.uMVP,false,mMVP);
    gl.uniform1f(PROG.sun.u.uT, now/1000);
    gl.uniform3f(PROG.sun.u.uEyeL, eye[0]/SUN_R, eye[1]/SUN_R, eye[2]/SUN_R);
    bindAttr(PROG.sun.a.aP,BUF.sphP,3);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,BUF.sphI);
    gl.drawElements(gl.TRIANGLES,GEO.sphCount,gl.UNSIGNED_SHORT,0);

    /* A star has no outline. Every glow before this point is behind the sphere,
       so the sphere still ended on a hard circle and read as a painted ball.
       These sit on top of the limb and eat the edge, which is the difference
       between a light source and a marble. */
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE); gl.depthMask(false);
    glowQuad([0,0,0], SUN_R*2.30*pulse, [1.00,0.72,0.34], 0.34, 2.0);
    glowQuad([0,0,0], SUN_R*1.42*pulse, [1.00,0.88,0.58], 0.44, 2.6);
    glowQuad([0,0,0], SUN_R*1.10*pulse, [1.00,0.96,0.84], 0.40, 3.6);
    gl.depthMask(true);

    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(PROG.solid);
    NX.model(0,0,0, 0, 1, 0, mM); NX.mul(mVP,mM,mMVP);
    gl.uniformMatrix4fv(PROG.solid.u.uMVP,false,mMVP);
    if(ringBase){
      gl.uniform3f(PROG.solid.u.uC,0.16,0.22,0.36); gl.uniform1f(PROG.solid.u.uO,0.9);
      bindAttr(PROG.solid.a.aP,ringBase.p,3);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ringBase.i);
      gl.drawElements(gl.TRIANGLES,ringBase.n,gl.UNSIGNED_SHORT,0);
    }
    if(ringArc){
      gl.blendFunc(gl.ONE,gl.ONE);
      NX.model(0,0,0, now/26000, 1, 0, mM); NX.mul(mVP,mM,mMVP);
      gl.uniformMatrix4fv(PROG.solid.u.uMVP,false,mMVP);
      if(ringVerified) gl.uniform3f(PROG.solid.u.uC,1.0,0.83,0.47);
      else             gl.uniform3f(PROG.solid.u.uC,1.0,0.62,0.26);
      gl.uniform1f(PROG.solid.u.uO, ringVerified?0.70:0.45);
      bindAttr(PROG.solid.a.aP,ringArc.p,3);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ringArc.i);
      gl.drawElements(gl.TRIANGLES,ringArc.n,gl.UNSIGNED_SHORT,0);
    }

    gl.disable(gl.BLEND);
    gl.useProgram(PROG.planet);
    gl.uniform3fv(PROG.planet.u.uEye,eye);
    bindAttr(PROG.planet.a.aP,BUF.sphP,3);
    bindAttr(PROG.planet.a.aN,BUF.sphN,3);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,BUF.sphI);
    bodies.forEach(function(b){
      b.ang += dt*b.L.speed; b.spin += dt*0.16;
      var R=b.L.r, ct=Math.cos(b.L.tilt), st=Math.sin(b.L.tilt);
      var x=Math.cos(b.ang)*R, z0=Math.sin(b.ang)*R;
      b.pos[0]=x; b.pos[1]=-z0*st; b.pos[2]=z0*ct;
      b.trailT=(b.trailT||0)+dt;
      if(b.trailT>0.08){ b.trailT=0;
        b.trail.push([b.pos[0],b.pos[1],b.pos[2]]);
        if(b.trail.length>26) b.trail.shift(); }
      NX.model(b.pos[0],b.pos[1],b.pos[2], 0, b.L.size, 0, mM);
      NX.mul(mVP,mM,mMVP);
      gl.uniformMatrix4fv(PROG.planet.u.uMVP,false,mMVP);
      gl.uniformMatrix4fv(PROG.planet.u.uM,false,mM);
      gl.uniform3fv(PROG.planet.u.uC,b.col);
      gl.uniform1f(PROG.planet.u.uE,0.055);
      gl.uniform1f(PROG.planet.u.uSeed,b.L.seed);
      gl.uniform1f(PROG.planet.u.uBand,b.L.band);
      gl.uniform1f(PROG.planet.u.uSpin,b.spin);
      gl.drawElements(gl.TRIANGLES,GEO.sphCount,gl.UNSIGNED_SHORT,0);
    });

    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE); gl.depthMask(false);
    drawStages(now);
    /* The status pip used to be a bright disc laid over the body, which at this
       size just detached and floated beside it as a white blob. It is a wide,
       faint halo now: the colour still says ok / watch / bad, but it belongs to
       the planet instead of sitting in front of it. */
    bodies.forEach(function(b){
      glowQuad(b.pos, b.L.size*3.1, b.col, 0.10, 2.6);
      var f=0.13+0.10*Math.abs(Math.sin(now/700+b.L.r));
      glowQuad(b.pos, b.L.size*2.0, b.pip, f, 2.2);
    });
    for(var i=couriers.length-1;i>=0;i--){
      var c=couriers[i]; c.t+=dt*c.v;
      if(c.t>=1){ couriers.splice(i,1); continue; }
      var p, cc;
      if(c.link){ p=NX.arcAt(c.link.a.pos, c.link.b.pos, c.link.bow, c.t); cc=c.link.a.col; }
      else { p=[c.b.pos[0]*c.t, c.b.pos[1]*c.t+Math.sin(c.t*Math.PI)*0.45, c.b.pos[2]*c.t]; cc=c.b.col; }
      var f=Math.sin(c.t*Math.PI);
      glowQuad(p, 0.46, cc, f*0.95, 2.2);
      glowQuad(p, 0.17, [1,1,1], f*0.95, 3.4);
    }
    drawFleet(now);
    /* whatever is in focus wears a ring, so the tap has an answer on screen */
    if(focus){
      var fp=1+Math.sin(now/420)*0.045;
      ringQuad(focus.pos, focus.L.size*1.80*fp, [1.0,0.86,0.52], 0.80, 0.070);
      ringQuad(focus.pos, focus.L.size*2.45*fp, [1.0,0.82,0.46], 0.16, 0.028);
      glowQuad(focus.pos, focus.L.size*2.9, focus.col, 0.14, 2.2);
    }
    gl.depthMask(true);
}
function bindAttr(loc,b,n){
  if(loc===undefined||loc<0) return;
  gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,n,gl.FLOAT,false,0,0);
}
function ringQuad(cen,size,col,op,w){
  gl.useProgram(PROG.ring2d);
  gl.uniformMatrix4fv(PROG.ring2d.u.uVP,false,mVP);

var headBox=null, labelBoxes=[];
function measureHead(){
  var h=document.getElementById('head');
  if(h.classList.contains('hide')){ headBox=null; return; }
  var r=h.getBoundingClientRect();
  headBox={l:r.left-8,r:r.right+8,t:r.top-8,b:r.bottom+16};
}
var tmp4=[0,0,0,0];
function screenOf(p){
  NX.xform(mVP,p,tmp4);
  if(tmp4[3]<=0.001) return null;
  return { x:(tmp4[0]/tmp4[3]*0.5+0.5)*W, y:(-tmp4[1]/tmp4[3]*0.5+0.5)*H, w:tmp4[3] };
}
function placeLabels(){
  if(view!=='now'){ labEls.forEach(function(e){ e.classList.add('off'); }); return; }
  var list=[];
  bodies.forEach(function(b,i){ var s=screenOf(b.pos); if(s) list.push({i:i,s:s}); });
  list.sort(function(a,b){ return a.s.w-b.s.w; });
  var boxes=[]; labelBoxes=boxes; var used=new Array(bodies.length);
  list.forEach(function(o){
    var el=labEls[o.i], x=o.s.x;
    var lift = (focus && bodies[o.i]===focus) ? 74 : 42;
    var y=o.s.y + (o.s.y < H*0.52 ? -lift : lift+2);
    if(x<-40||x>W+40||y<-40||y>H+40) return;
    var w=el.offsetWidth||120, h=el.offsetHeight||40;
    x=Math.max(w/2+8, Math.min(W-w/2-8, x));
    y=Math.max(h/2+6, Math.min(H-h/2-74, y));
    var box={l:x-w/2-7,r:x+w/2+7,t:y-h/2-6,b:y+h/2+6};
    if(headBox && box.l<headBox.r && box.r>headBox.l && box.t<headBox.b && box.b>headBox.t) return;
    for(var k=0;k<boxes.length;k++){ var q=boxes[k];
      if(box.l<q.r&&box.r>q.l&&box.t<q.b&&box.b>q.t) return; }
    boxes.push(box); used[o.i]=true;
    el.style.left=x+'px'; el.style.top=y+'px';
  });
  labEls.forEach(function(e,i){ e.classList.toggle('off', !used[i]); });
}

/* ---------------- touch ---------------- */
function placeBubbles(){
  var taken=[];
  for(var i=0;i<aliens.length;i++){
    var al=aliens[i], el=al.el; if(!el) continue;
    if(view!=='now'){ el.style.opacity='0'; continue; }
    var sp=screenOf(al.pos);
    if(!sp){ el.style.opacity='0'; continue; }
    var w=el.offsetWidth||150, h=el.offsetHeight||30;
    var x=Math.max(w/2+8, Math.min(W-w/2-8, sp.x));
    var y=Math.max(h/2+6, Math.min(H-h/2-80, sp.y-34));
    /* never sit on top of a label or the headline — walk upward until clear */
    for(var g=0; g<8; g++){
      var box={l:x-w/2-6,r:x+w/2+6,t:y-h/2-5,b:y+h/2+5}, hit=false;
      if(headBox && box.l<headBox.r && box.r>headBox.l && box.t<headBox.b && box.b>headBox.t) hit=true;
      for(var k=0;!hit && k<labelBoxes.length;k++){ var q=labelBoxes[k];
        if(box.l<q.r&&box.r>q.l&&box.t<q.b&&box.b>q.t) hit=true; }
      for(var j=0;!hit && j<taken.length;j++){ var tb=taken[j];
        if(box.l<tb.r&&box.r>tb.l&&box.t<tb.b&&box.b>tb.t) hit=true; }
      if(!hit){ taken.push(box); break; }
      y -= (h+12);
      if(y < h/2+6){ y = -999; break; }   /* nowhere clear: do not draw it */
    }
    if(y < 0){ el.style.opacity='0'; continue; }
    el.style.left=x+'px'; el.style.top=y+'px';
    var fade=Math.min(1, Math.sin(Math.min(1,al.t)*Math.PI)*2.2);
    el.style.opacity=String(Math.max(0,Math.min(1,fade)));
  }
}

/* How close the camera may get, and how far it may back off. These used to be
   one pair of numbers for a scene ten units wide; the head is 1.35 across, so a
   floor of 5.5 meant it could never actually be approached. Each scene gets its
   own range. */
function zoomRange(){ return (view==='brain') ? [1.90, 13.0] : [5.5, 26.0]; }

var drag=null,pinch=null,idleT=0;
cv.addEventListener('pointerdown',function(e){
  if(e.pointerType==='touch' && pinch) return;
  drag={x:e.clientX,y:e.clientY,az:camState.tAz,el:camState.tEl,moved:0}; idleT=0;
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
});
cv.addEventListener('pointermove',function(e){
  if(!drag||pinch) return;
  var dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  drag.moved=Math.max(drag.moved,Math.abs(dx)+Math.abs(dy));
  camState.tAz=drag.az-dx*0.0060;
  camState.tEl=Math.max(0.16,Math.min(1.34,drag.el+dy*0.0045));
  idleT=0;
});
cv.addEventListener('pointerup',function(e){
  var tapped = drag && drag.moved<9; drag=null;
  /* In the head a tap has nothing to focus, so it does the thing that is
     actually wanted there: it gets the panel out of the way. Tapping again
     brings it back. Nothing is lost and nothing needs a button. */
  if(tapped && view==='brain'){ brainBare(!BARE); return; }
  if(tapped) hit(e.clientX,e.clientY);
});
cv.addEventListener('pointercancel',function(){ drag=null; });
cv.addEventListener('wheel',function(e){
  var zr=zoomRange();
  camState.tDist=Math.max(zr[0],Math.min(zr[1],camState.tDist+e.deltaY*0.012)); idleT=0;
},{passive:true});
cv.addEventListener('touchstart',function(e){
  if(e.touches.length===2){ pinch={d:td(e),base:camState.tDist}; drag=null; }
},{passive:true});
cv.addEventListener('touchmove',function(e){
  if(pinch&&e.touches.length===2){
    var d=td(e), zr2=zoomRange();
    camState.tDist=Math.max(zr2[0],Math.min(zr2[1],pinch.base*(pinch.d/Math.max(1,d)))); idleT=0; }
},{passive:true});
cv.addEventListener('touchend',function(e){ if(e.touches.length<2) pinch=null; },{passive:true});
function td(e){ var a=e.touches[0],b=e.touches[1];
  return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY); }

function hit(px,py){
  var best=null,bd=1e9, k=H*0.5/Math.tan(FOV/2);
  bodies.forEach(function(b){
    var s=screenOf(b.pos); if(!s) return;
    var rad=Math.max(26, b.L.size*k/Math.max(0.6,s.w));
    var d=Math.hypot(px-s.x,py-s.y);
    if(d<rad && d<bd){ bd=d; best=b; }
  });
  if(best){ focusOn(best); return openSystem(best.def); }
  var st=stages();
  if(st.length){
    var spin=performance.now()/48000, bk=null, bkd=1e9;
    for(var q=0;q<st.length;q++){
      var aa=spin+(q/st.length)*Math.PI*2;
      var RR=beltR(); var zz=Math.sin(aa)*RR;
      var sp=screenOf([Math.cos(aa)*RR, -zz*Math.sin(STAGE_TILT), zz*Math.cos(STAGE_TILT)]);
      if(!sp) continue;
      var dd=Math.hypot(px-sp.x,py-sp.y);
      if(dd<30 && dd<bkd){ bkd=dd; bk=st[q]; }
    }
    if(bk) return openStage(bk);
  }
  var ss=screenOf([0,0,0]);
  if(ss){ var rr=Math.max(46, SUN_R*k/Math.max(0.6,ss.w));
    if(Math.hypot(px-ss.x,py-ss.y)<rr) return setView('count'); }
  closeSheet();
}
