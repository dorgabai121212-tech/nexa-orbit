/* The PC writes an encrypted blob into a secret gist. The phone reads it
   through api.github.com, which is designed for browsers and therefore
   always sends the CORS header a raw file might not. */
var PIN=null;
var CACHE_KEY="nexa.last.v1";
var DIAG={ gist:"", tries:0, lastTry:"", http:"", step:"boot", bytes:0, systems:0, err:"" };
function b64(s){ var raw=atob(s.replace(/\s+/g,'')), a=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) a[i]=raw.charCodeAt(i); return a; }
function eq(a,b){ if(a.length!==b.length) return false;
  var d=0; for(var i=0;i<a.length;i++) d|=a[i]^b[i]; return d===0; }
async function decrypt(payload, pin){
  var raw=b64(payload);
  var salt=raw.slice(0,16), iv=raw.slice(16,32), mac=raw.slice(32,64), ct=raw.slice(64);
  var km=await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
  var bits=new Uint8Array(await crypto.subtle.deriveBits(
    {name:'PBKDF2',salt:salt,iterations:120000,hash:'SHA-256'}, km, 512));
  var aesKey=bits.slice(0,32), macKey=bits.slice(32,64);
  var hk=await crypto.subtle.importKey('raw',macKey,{name:'HMAC',hash:'SHA-256'},false,['sign']);
  var body=new Uint8Array(salt.length+iv.length+ct.length);
  body.set(salt,0); body.set(iv,salt.length); body.set(ct,salt.length+iv.length);
  var calc=new Uint8Array(await crypto.subtle.sign('HMAC',hk,body));
  if(!eq(calc,mac)) throw new Error('mac');
  var ak=await crypto.subtle.importKey('raw',aesKey,{name:'AES-CBC'},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-CBC',iv:iv},ak,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
async function fetchPayload(){
  DIAG.gist=GIST_ID; DIAG.tries++; DIAG.lastTry=new Date().toLocaleTimeString('he-IL');
  DIAG.step='מוריד מגיטהאב';
  var r;
  try{
    r=await fetch('https://api.github.com/gists/'+GIST_ID+'?t='+Date.now(),
      {cache:'no-store', headers:{'Accept':'application/vnd.github+json'}});
  }catch(e){ DIAG.http='נכשל'; throw new Error('אין חיבור לגיטהאב'); }
  DIAG.http=r.status+' '+r.statusText;
  if(r.status===403) throw new Error('גיטהאב חסם זמנית (יותר מדי בקשות). ינסה שוב עוד שתי דקות.');
  if(r.status===404) throw new Error('הכתובת לא נמצאה. צריך להריץ שוב את קובץ 12.');
  if(!r.ok) throw new Error('גיטהאב החזיר '+r.status);
  DIAG.step='קורא את הקובץ';
  var j=await r.json();
  var f=j.files && (j.files['state.txt'] || j.files[Object.keys(j.files)[0]]);
  if(!f) throw new Error('אין קובץ מצב בכתובת. הרץ את קובץ 13.');
  var txt;
  if(f.truncated && f.raw_url){ var r2=await fetch(f.raw_url,{cache:'no-store'}); txt=(await r2.text()).trim(); }
  else txt=String(f.content||'').trim();
  DIAG.bytes=txt.length;
  if(!txt) throw new Error('הקובץ בכתובת ריק.');
  if(txt==='init') throw new Error('עוד לא שודר כלום. הרץ את קובץ 13.');
  return txt;
}
async function load(pin){
  var txt=await fetchPayload();
  DIAG.step='מפענח';
  var j;
  try{ j = txt.charAt(0)==='{' ? JSON.parse(txt) : await decrypt(txt,pin); }
  catch(e){ throw new Error('הקוד לא פותח את הנתונים.'); }
  if(!j||!j.counter) throw new Error('הנתונים שהגיעו לא בפורמט הנכון.');
  DIAG.systems=(j.systems||[]).length;
  DIAG.step='מוכן'; DIAG.err='';
  return j;
}
async function pull(){
  if(!GIST_ID||!PIN) return;
  try{
    D=await load(PIN);
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(D)); }catch(_){}
    paint(); status();
  }catch(e){
    DIAG.err = (e && e.message) ? e.message : String(e);
    status();
  }
}
function askPin(){
  var box=document.getElementById('lock'), inp=document.getElementById('pin');
  var err=document.getElementById('pinerr');
  box.classList.add('on'); document.getElementById('boot').classList.add('gone');
  function go(){
    var v=inp.value.trim(); if(!v) return;
    err.textContent='בודק...';
    load(v).then(function(j){
      PIN=v; try{ localStorage.setItem(STORE_KEY,v); }catch(_){}
      D=j; paint(); checkStale(); box.classList.remove('on'); err.textContent='';
    }).catch(function(e){
      err.textContent = (e && e.message && e.message.indexOf('http')===0)
        ? 'לא הצלחתי להגיע לנתונים. יש אינטרנט?' : 'הקוד לא פתח את הנתונים. נסה שוב.';
    });
  }
  document.getElementById('pinb').onclick=go;
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter') go(); });
}

/* ---------------- boot ---------------- */
function loop(now){
  var dt=Math.min(0.05,(now-loop.t)/1000); loop.t=now;
  idleT+=dt;
  if(!qSettled){
    qSamples.push(dt);
    if(qSamples.length>=90){
      var sorted=qSamples.slice(10).sort(function(a,b){return a-b;});
      var med=sorted[Math.floor(sorted.length/2)];
      if(med>0.030){ QUAL=0; }
      qSettled=true;
      DIAG.step = 'איכות ' + (QUAL?'מלאה':'חסכונית') + ' · ' + Math.round(med*1000) + ' מ"ש לפריים';
    }
  }
  if(!drag&&!pinch&&idleT>3) camState.tAz+=dt*0.035;
  if(now-lastCour  > 1400){ lastCour=now;  spawnCourier(); }
  if(now-lastShip  > 3300){ lastShip=now;  spawnShip(); }
  if(now-lastAlien > 8500){ lastAlien=now; spawnAlien(); }

  for(var si=ships.length-1; si>=0; si--){
    var sh=ships[si]; sh.t+=dt*sh.v;
    if(sh.t>=1){ ships.splice(si,1); continue; }
    var pt=NX.arcAt(sh.from, sh.to, sh.bow, sh.t);
    var nx=NX.arcAt(sh.from, sh.to, sh.bow, Math.min(1,sh.t+0.02));
    sh.dir=[nx[0]-pt[0], nx[1]-pt[1], nx[2]-pt[2]];
    sh.pos=pt;
  }
  for(var ai=aliens.length-1; ai>=0; ai--){
    var al=aliens[ai]; al.t+=dt*al.v; al.ang+=dt*al.drift;
    if(al.t>=1){ if(al.el && al.el.parentNode) al.el.parentNode.removeChild(al.el);
                 aliens.splice(ai,1); continue; }
    al.pos=[Math.cos(al.ang)*al.r,
            al.y+Math.sin(now/2100+al.phase)*0.055,
            Math.sin(al.ang)*al.r];
  }
  refreshLinkGeometry();

  draw(now,dt);
  placeLabels();
  placeBubbles();
  requestAnimationFrame(loop);
}
loop.t=performance.now();

document.getElementById('stale').addEventListener('click', openDiag);
document.getElementById('head').addEventListener('click', function(e){
  if(e.target.closest('.chip') || DIAG.err) openDiag();
});

if(gl){
  try{
    initGL(); resize(); paint(); setView('brain');
    window.addEventListener('resize',function(){ resize(); measureHead(); });
    window.addEventListener('orientationchange',function(){ setTimeout(function(){ resize(); measureHead(); },250); });
    requestAnimationFrame(loop);
    if(GIST_ID){
      var cached=null; try{ cached=localStorage.getItem(CACHE_KEY); }catch(_){}
      if(cached){ try{ var c=JSON.parse(cached); if(c&&c.counter){ D=c; paint(); } }catch(_){} }
      var saved=null; try{ saved=localStorage.getItem(STORE_KEY); }catch(_){}
      if(saved){ PIN=saved; pull(); } else askPin();
      setInterval(pull,PULL_MS); setInterval(status,30000);
    }
    setTimeout(function(){ document.getElementById('boot').classList.add('gone'); },520);
  }catch(err){
    var f=document.getElementById('fail');
    f.style.display='flex'; f.textContent='שגיאה בהפעלת התלת-ממד: '+err.message;
    document.getElementById('boot').classList.add('gone');
  }
}
